<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <title>{% block title %} {% endblock %}</title>
    </head>
    <body>
        <div class="container-fluid">
            <div class="row">
                <div class="col-12 d-md-none mb-3">
                    <button class="btn btn-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navbar" aria-expanded="false" aria-controls="navbar">
                        <span aria-hidden="true">&#9776;</span> Menu
                    </button>
                </div>
                <nav id="navbar" class="collapse d-md-block col-12 col-md-3 col-lg-2 bg-dark text-white">
                    <div class="position-sticky pt-3 position-sticky"  style="position:sticky; top:0;">
                        <h4 class="px-3 text-info fw-bold">Flight Manager</h4>
                        <hr class="text-secondary">
                        <ul class="nav flex-column">
                            <li class="nav-item mb-2">
                                <a class="nav-link text-white active" href="{% url 'dashboard' %}">Dashboard</a>
                            </li>
                            <li class="nav-item mb-2">
                                <a class="nav-link text-white active" href="{% url 'flight_index' %}">Flights Lists</a>
                            </li>
                            <li class="nav-item mb-2">
                                <a class="nav-link text-white active" href="{% url 'chat' %}">AI Assistant</a>
                            </li>
                        </ul>
                    </div>
                </nav>
                <main class="col-12 col-md-9 col-lg-10 px-md-4 py-4 bg-light" style="min-height: 100vh;">
                    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center py-3 pb-2 mb-4 border-bottom bg-white p-3 rounded shadow-sm">
                        <div style="position: sticky; top:0;">
                            <h1 class="h3 mb-0">{% block page_title %} Dashboard {%endblock%}</h1>
                        </div>
                        <div>
                            <span class="text-muted small">{% block parent_page %}Home/Dashboard {%endblock%}</span>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-body">
                            {% block body %}
                            {% endblock %}
                        </div>
                    </div>
                    
                </main>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
