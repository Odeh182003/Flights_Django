{% extends "users/layout.html" %}

{% block title %}Login - Flight Manager{% endblock %}

{% block body %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 85vh;">
    <div class="row w-100 justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg border-0 rounded-4 p-4 bg-white">
                <div class="card-body">
                    <!-- Heading & Subtitle -->
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-dark">Flight Manager</h3>
                        <p class="text-muted small">Please sign in to your account</p>
                    </div>

                    <!-- Error / Status Message Alert -->
                    {% if message %}
                        <div class="alert alert-danger alert-dismissible fade show py-2 small rounded-3 shadow-sm" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endif %}

                    <!-- Login Form -->
                    <form action="{% url 'users:login' %}" method="POST">
                        {% csrf_token %}
                        {% if request.GET.next %}
                        <input type="hidden" name="next" value="{{ request.GET.next }}">
                        {% endif %}
                        <div class="mb-3">
                            <label for="username" class="form-label text-secondary small fw-semibold">Username</label>
                            <input type="text" class="form-control form-control-lg fs-6 rounded-3" id="username" name="username" placeholder="Enter your username" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label text-secondary small fw-semibold">Password</label>
                            <input type="password" class="form-control form-control-lg fs-6 rounded-3" id="password" name="password" placeholder="Enter your password" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-dark btn-lg rounded-3 fw-semibold shadow-sm">Sign In</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
